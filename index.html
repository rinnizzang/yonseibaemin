<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>배달의민족 - 주문하기 개선안 프로토타입</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+KR:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: 'Noto Sans KR', 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background-color: #E5E7EB;
      margin: 0;
      padding: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100dvh;
      overflow: hidden;
    }

    /* 모바일 앱 컨테이너 */
    .app-shell {
      width: 100%;
      max-width: 430px;
      height: 100dvh;
      background-color: #F4F5F7;
      position: relative;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.12);
    }

    /* 스크롤 영역: 첫 번째와 마지막 섹션도 정가운데 올 수 있도록 충분한 상하 여백 확보 */
    .scroll-viewport {
      flex: 1;
      overflow-y: auto;
      overflow-x: hidden;
      padding: 36vh 20px 44vh 20px;
      scrollbar-width: none; /* Firefox */
      -ms-overflow-style: none; /* IE/Edge */
    }
    .scroll-viewport::-webkit-scrollbar {
      display: none; /* Chrome/Safari */
    }

    /* 섹션 카드 공통 스타일 */
    .section-card {
      background-color: #FFFFFF;
      border-radius: 18px;
      box-shadow: 0 3px 14px rgba(0, 0, 0, 0.055);
      border: 1px solid rgba(0, 0, 0, 0.04);
      margin-bottom: 16px;
      overflow: hidden;
      transition:
        background-color 0.35s cubic-bezier(0.22, 1, 0.36, 1),
        box-shadow 0.35s cubic-bezier(0.22, 1, 0.36, 1),
        transform 0.35s cubic-bezier(0.22, 1, 0.36, 1),
        opacity 0.35s ease;
    }

    /* 접힌(완료된) 섹션 카드 스타일 - 와이어프레임 2~6번 반영 */
    .section-card.collapsed {
      background-color: #F3F4F6;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04);
      border: 1px solid #E5E7EB;
      cursor: pointer;
    }
    .section-card.collapsed:hover {
      background-color: #ECEEF2;
    }

    /* 새로 등장하는 섹션 애니메이션 */
    @keyframes sectionReveal {
      0% {
        opacity: 0;
        transform: translateY(18px) scale(0.98);
      }
      100% {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }
    .section-reveal {
      animation: sectionReveal 0.42s cubic-bezier(0.22, 1, 0.36, 1) forwards;
    }

    /* 아코디언 바디 부드러운 열림/닫힘 */
    .accordion-body {
      display: grid;
      grid-template-rows: 1fr;
      transition: grid-template-rows 0.38s cubic-bezier(0.22, 1, 0.36, 1), opacity 0.28s ease;
      opacity: 1;
    }
    .section-card.collapsed .accordion-body {
      grid-template-rows: 0fr;
      opacity: 0;
      pointer-events: none;
    }
    .accordion-inner {
      overflow: hidden;
    }

    /* 접힌 상태 헤더 애니메이션 */
    .collapsed-header {
      max-height: 0;
      opacity: 0;
      padding: 0 22px;
      overflow: hidden;
      transition: max-height 0.35s cubic-bezier(0.22, 1, 0.36, 1), opacity 0.25s ease, padding 0.35s ease;
    }
    .section-card.collapsed .collapsed-header {
      max-height: 76px;
      opacity: 1;
      padding: 18px 22px;
    }

    /* 커스텀 와이어프레임 체크박스 (둥근 사각형) */
    .option-row {
      padding: 10px 12px;
      border-radius: 12px;
      border: 1.5px solid transparent;
      background-color: transparent;
      transition:
        opacity 0.25s ease,
        background-color 0.25s ease,
        border-color 0.25s ease,
        transform 0.2s ease;
    }

    /* 선택이 이루어진 체크박스 그룹에서 선택되지 않은 항목 연하게 처리 */
    .option-list.has-selection .option-row:not(.selected) {
      opacity: 0.35;
    }
    .option-list.has-selection .option-row:not(.selected):hover {
      opacity: 0.65;
    }

    /* 사용자가 선택한 항목 하이라이팅 */
    .option-row.selected {
      opacity: 1 !important;
      background-color: rgba(28, 227, 206, 0.12);
      border-color: #1CE3CE;
      box-shadow: 0 2px 8px rgba(28, 227, 206, 0.14);
    }
    .option-row.selected .option-label {
      font-weight: 700;
      color: #111827;
    }

    .custom-checkbox {
      width: 22px;
      height: 22px;
      border-radius: 6px;
      border: 1.8px solid #9CA3AF;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      background-color: #FFFFFF;
      transition: all 0.18s ease;
    }
    .option-row.selected .custom-checkbox {
      background-color: #1CE3CE;
      border-color: #1CE3CE;
    }
    .option-row.selected .check-icon {
      opacity: 1;
      transform: scale(1);
    }
    .check-icon {
      opacity: 0;
      transform: scale(0.6);
      transition: all 0.18s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    /* 하단 결제 버튼 상태 전환 */
    .pay-btn {
      transition: all 0.32s cubic-bezier(0.22, 1, 0.36, 1);
    }
    .pay-btn:disabled {
      background-color: #CCF6F0;
      color: #8C9896;
      cursor: not-allowed;
    }
    .pay-btn:not(:disabled) {
      background-color: #1CE3CE;
      color: #111827;
      box-shadow: 0 6px 18px rgba(28, 227, 206, 0.35);
      cursor: pointer;
    }
    .pay-btn:not(:disabled):active {
      transform: scale(0.97);
    }

    /* 토스트 알림 */
    .toast-pill {
      transition: opacity 0.25s ease, transform 0.25s cubic-bezier(0.22, 1, 0.36, 1);
    }
  </style>
</head>
<body>

  <div class="app-shell">
    <!-- 상단 고정 헤더 -->
    <header class="sticky top-0 z-30 bg-white h-14 px-4 flex items-center justify-between shadow-[0_1px_4px_rgba(0,0,0,0.06)] shrink-0">
      <div class="w-14"></div>
      <h1 class="text-[17px] font-bold text-gray-900 tracking-tight">주문하기</h1>
      <div class="w-14 flex justify-end">
        <button
          id="resetBtn"
          type="button"
          title="처음부터 다시하기"
          class="text-xs font-medium text-gray-400 hover:text-gray-700 px-2 py-1 rounded-md hover:bg-gray-100 transition"
        >
          초기화
        </button>
      </div>
    </header>

    <!-- 중앙 자동 스크롤 뷰포트 -->
    <main id="scrollViewport" class="scroll-viewport">
      <div id="sectionsContainer" class="w-full max-w-[360px] mx-auto">

        <!-- =========================================================
             SECTION 1: 배달 주소
        ========================================================== -->
        <section id="section-0" data-step="0" class="section-card section-reveal">
          <!-- 접혔을 때 표시되는 요약 헤더 -->
          <div class="collapsed-header flex items-center justify-between" onclick="handleHeaderClick(0)">
            <div class="flex items-center gap-2.5 min-w-0">
              <span class="text-[16px] font-bold text-gray-900 shrink-0">배달 주소</span>
              <span id="summary-0" class="text-[13px] text-gray-500 truncate"></span>
            </div>
            <!-- 민트색 아래 화살표 -->
            <svg class="w-6 h-6 text-[#1CE3CE] shrink-0" fill="none" stroke="currentColor" stroke-width="2.4" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" d="M19 9l-7 7-7-7" />
            </svg>
          </div>

          <!-- 펼쳤을 때 입력 폼 -->
          <div class="accordion-body">
            <div class="accordion-inner">
              <div class="p-5">
                <h2 class="text-[16px] font-bold text-gray-900 mb-3.5">배달 주소</h2>

                <!-- 신촌(연세로 50) 실제 지도 연동 영역 -->
                <div class="w-full h-[146px] bg-[#E5E7EB] rounded-xl mb-4 relative overflow-hidden border border-gray-200 shadow-inner">
                  <iframe
                    title="신촌 연세로 50 지도"
                    src="https://www.openstreetmap.org/export/embed.html?bbox=126.9325%2C37.5542%2C126.9428%2C37.5615&layer=mapnik&marker=37.5585%2C126.9376"
                    class="w-full h-full border-0"
                    loading="lazy"
                  ></iframe>
                  <!-- 상단 신촌 위치 뱃지 오버레이 -->
                  <div class="pointer-events-none absolute top-2.5 left-2.5 bg-white/95 backdrop-blur-sm px-2.5 py-1 rounded-full shadow-sm border border-gray-200/80 flex items-center gap-1.5">
                    <span class="w-2 h-2 rounded-full bg-[#1CE3CE]"></span>
                    <span class="text-[11px] font-bold text-gray-800">신촌 · 연세로 50</span>
                  </div>
                </div>

                <!-- 기본 주소 -->
                <div class="mb-3">
                  <p class="text-[15px] font-bold text-gray-900 mb-1.5">서울 서대문구 연세로50</p>
                  <input
                    id="detailAddressInput"
                    type="text"
                    placeholder="상세 주소 입력"
                    class="w-full h-[38px] px-3 text-[13.5px] text-gray-800 placeholder-gray-400 border border-gray-300 rounded-md focus:outline-none focus:border-gray-800 transition"
                  />
                </div>

                <!-- 공동현관 비밀번호 -->
                <div class="mb-3">
                  <label for="gateCodeInput" class="block text-[13.5px] font-bold text-gray-900 mb-1.5">공동현관 비밀번호</label>
                  <input
                    id="gateCodeInput"
                    type="text"
                    placeholder="예) #1234"
                    class="w-full h-[38px] px-3 text-[13.5px] text-gray-800 placeholder-gray-400 border border-gray-300 rounded-md focus:outline-none focus:border-gray-800 transition"
                  />
                </div>

                <!-- 찾아오는 길 안내 -->
                <div class="mb-5">
                  <label for="directionInput" class="block text-[13.5px] font-bold text-gray-900 mb-1.5">찾아오는 길 안내</label>
                  <input
                    id="directionInput"
                    type="text"
                    placeholder="예) 언더우드관 뒤 건물이에요"
                    class="w-full h-[38px] px-3 text-[13.5px] text-gray-800 placeholder-gray-400 border border-gray-300 rounded-md focus:outline-none focus:border-gray-800 transition"
                  />
                </div>

                <!-- 주소 등록 버튼 -->
                <button
                  id="submitAddressBtn"
                  type="button"
                  onclick="submitAddress()"
                  class="w-full h-[42px] bg-black hover:bg-gray-900 active:scale-[0.99] text-white text-[14px] font-bold rounded-md transition"
                >
                  주소 등록
                </button>
              </div>
            </div>
          </div>
        </section>

        <!-- =========================================================
             SECTION 2: 배달 요청사항
        ========================================================== -->
        <section id="section-1" data-step="1" class="section-card hidden">
          <div class="collapsed-header flex items-center justify-between" onclick="handleHeaderClick(1)">
            <div class="flex items-center gap-2.5 min-w-0">
              <span class="text-[16px] font-bold text-gray-900 shrink-0">배달 요청사항</span>
              <span id="summary-1" class="text-[13px] text-gray-500 truncate"></span>
            </div>
            <svg class="w-6 h-6 text-[#1CE3CE] shrink-0" fill="none" stroke="currentColor" stroke-width="2.4" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" d="M19 9l-7 7-7-7" />
            </svg>
          </div>

          <div class="accordion-body">
            <div class="accordion-inner">
              <div class="p-5">
                <h2 class="text-[16px] font-bold text-gray-900 mb-3.5">배달 요청사항</h2>
                <div id="deliveryOptionsList" class="option-list space-y-1.5">
                  <!-- JS로 렌더링 -->
                </div>

                <!-- '직접 입력' 선택 시 노출 -->
                <div id="deliveryCustomBox" class="hidden mt-3 pt-2.5 border-t border-gray-100">
                  <div class="flex gap-2">
                    <input
                      id="deliveryCustomInput"
                      type="text"
                      placeholder="기사님께 전달할 요청사항 입력"
                      class="flex-1 h-[38px] px-3 text-[13px] border border-gray-300 rounded-md focus:outline-none focus:border-gray-800"
                    />
                    <button
                      type="button"
                      onclick="confirmCustomDelivery()"
                      class="px-3.5 h-[38px] bg-gray-900 text-white text-[13px] font-bold rounded-md shrink-0"
                    >
                      확인
                    </button>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </section>

        <!-- =========================================================
             SECTION 3: 가게 요청사항
        ========================================================== -->
        <section id="section-2" data-step="2" class="section-card hidden">
          <div class="collapsed-header flex items-center justify-between" onclick="handleHeaderClick(2)">
            <div class="flex items-center gap-2.5 min-w-0">
              <span class="text-[16px] font-bold text-gray-900 shrink-0">가게 요청사항</span>
              <span id="summary-2" class="text-[13px] text-gray-500 truncate"></span>
            </div>
            <svg class="w-6 h-6 text-[#1CE3CE] shrink-0" fill="none" stroke="currentColor" stroke-width="2.4" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" d="M19 9l-7 7-7-7" />
            </svg>
          </div>

          <div class="accordion-body">
            <div class="accordion-inner">
              <div class="p-5">
                <h2 class="text-[16px] font-bold text-gray-900 mb-3.5">가게 요청사항</h2>
                <div id="storeOptionsList" class="option-list space-y-1.5">
                  <!-- JS로 렌더링 -->
                </div>

                <!-- '기타 (직접 입력)' 선택 시 노출 -->
                <div id="storeCustomBox" class="hidden mt-3 pt-2.5 border-t border-gray-100">
                  <input
                    id="storeCustomInput"
                    type="text"
                    placeholder="가게 사장님께 전달할 요청사항 입력"
                    class="w-full h-[38px] px-3 text-[13px] border border-gray-300 rounded-md focus:outline-none focus:border-gray-800"
                  />
                </div>

                <!-- 중복 선택 완료 확인 버튼 -->
                <button
                  id="confirmStoreBtn"
                  type="button"
                  onclick="confirmStoreRequests()"
                  class="mt-4 w-full h-[40px] bg-gray-900 hover:bg-black active:scale-[0.99] text-white text-[13.5px] font-bold rounded-md transition"
                >
                  확인
                </button>
              </div>
            </div>
          </div>
        </section>

        <!-- =========================================================
             SECTION 4: 결제수단
        ========================================================== -->
        <section id="section-3" data-step="3" class="section-card hidden">
          <div class="collapsed-header flex items-center justify-between" onclick="handleHeaderClick(3)">
            <div class="flex items-center gap-2.5 min-w-0">
              <span class="text-[16px] font-bold text-gray-900 shrink-0">결제수단</span>
              <span id="summary-3" class="text-[13px] text-gray-500 truncate"></span>
            </div>
            <svg class="w-6 h-6 text-[#1CE3CE] shrink-0" fill="none" stroke="currentColor" stroke-width="2.4" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" d="M19 9l-7 7-7-7" />
            </svg>
          </div>

          <div class="accordion-body">
            <div class="accordion-inner">
              <div class="p-5">
                <h2 class="text-[16px] font-bold text-gray-900 mb-3.5">결제수단</h2>
                <div id="paymentOptionsList" class="option-list space-y-1.5">
                  <!-- JS로 렌더링 -->
                </div>
              </div>
            </div>
          </div>
        </section>

        <!-- =========================================================
             SECTION 5: 할인쿠폰
        ========================================================== -->
        <section id="section-4" data-step="4" class="section-card hidden">
          <div class="collapsed-header flex items-center justify-between" onclick="handleHeaderClick(4)">
            <div class="flex items-center gap-2.5 min-w-0">
              <span class="text-[16px] font-bold text-gray-900 shrink-0">할인쿠폰</span>
              <span id="summary-4" class="text-[13px] text-[#2B38E6] font-medium truncate"></span>
            </div>
            <svg class="w-6 h-6 text-[#1CE3CE] shrink-0" fill="none" stroke="currentColor" stroke-width="2.4" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" d="M19 9l-7 7-7-7" />
            </svg>
          </div>

          <div class="accordion-body">
            <div class="accordion-inner">
              <div class="p-5">
                <div class="flex items-baseline gap-2 mb-3.5">
                  <h2 class="text-[16px] font-bold text-gray-900">할인쿠폰</h2>
                  <span id="couponBadgeText" class="text-[11.5px] font-semibold text-[#2B38E6]">최대 할인 적용중</span>
                </div>

                <!-- 쿠폰 선택 박스 (와이어프레임 5번 반영) -->
                <button
                  type="button"
                  onclick="toggleCouponDropdown()"
                  class="w-full h-[42px] px-3.5 border border-gray-300 hover:border-gray-500 rounded-md flex items-center justify-between text-left transition bg-white"
                >
                  <span id="selectedCouponLabel" class="text-[14px] text-gray-800">
                    <strong class="text-[#2B38E6] font-bold">3,000원</strong> 할인 적용됨
                  </span>
                  <svg id="couponChevron" class="w-4 h-4 text-gray-600 transition-transform duration-200" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M9 5l7 7-7 7" />
                  </svg>
                </button>

                <!-- 쿠폰 목록 선택 드롭다운 (클릭 시 펼쳐짐) -->
                <div id="couponDropdown" class="hidden mt-2 border border-gray-200 rounded-md divide-y divide-gray-100 bg-gray-50 overflow-hidden">
                  <button type="button" onclick="selectCoupon(3000, '최대 할인 쿠폰')" class="w-full px-3.5 py-2.5 text-left text-[13px] hover:bg-indigo-50 flex items-center justify-between">
                    <span><strong class="text-[#2B38E6]">3,000원</strong> 브랜드 중복 할인 (최대)</span>
                    <span class="text-[11px] text-[#2B38E6] font-semibold">선택</span>
                  </button>
                  <button type="button" onclick="selectCoupon(2000, '배민클럽 쿠폰')" class="w-full px-3.5 py-2.5 text-left text-[13px] hover:bg-indigo-50 flex items-center justify-between">
                    <span><strong class="text-[#2B38E6]">2,000원</strong> 배민클럽 전용 쿠폰</span>
                    <span class="text-[11px] text-gray-400">선택</span>
                  </button>
                  <button type="button" onclick="selectCoupon(0, '적용 안 함')" class="w-full px-3.5 py-2.5 text-left text-[13px] text-gray-500 hover:bg-gray-100 flex items-center justify-between">
                    <span>쿠폰 적용 안 함</span>
                    <span class="text-[11px] text-gray-400">선택</span>
                  </button>
                </div>

                <!-- 쿠폰 확인 후 다음(영수증)으로 이동 버튼 -->
                <button
                  id="confirmCouponBtn"
                  type="button"
                  onclick="confirmCouponStep()"
                  class="mt-3.5 w-full h-[38px] bg-gray-900 hover:bg-black text-white text-[13.5px] font-bold rounded-md transition"
                >
                  할인 적용 확인
                </button>
              </div>
            </div>
          </div>
        </section>

        <!-- =========================================================
             SECTION 6: 영수증
        ========================================================== -->
        <section id="section-5" data-step="5" class="section-card hidden">
          <div class="collapsed-header flex items-center justify-between" onclick="handleHeaderClick(5)">
            <div class="flex items-center gap-2.5 min-w-0">
              <span class="text-[16px] font-bold text-gray-900 shrink-0">영수증</span>
              <span id="summary-5" class="text-[13px] text-gray-700 font-semibold truncate"></span>
            </div>
            <svg class="w-6 h-6 text-[#1CE3CE] shrink-0" fill="none" stroke="currentColor" stroke-width="2.4" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" d="M19 9l-7 7-7-7" />
            </svg>
          </div>

          <div class="accordion-body">
            <div class="accordion-inner">
              <div class="p-5">
                <h2 class="text-[16px] font-bold text-gray-900 mb-4">영수증</h2>

                <!-- 기본 금액 내역 -->
                <div class="space-y-2 text-[14px] text-gray-700 mb-4">
                  <div class="flex justify-between">
                    <span>메뉴금액</span>
                    <span class="font-medium">38,500원</span>
                  </div>
                  <div class="flex justify-between">
                    <span>배달팁</span>
                    <span class="font-medium">2,000원</span>
                  </div>
                </div>

                <!-- 할인 내역 -->
                <div class="space-y-2 text-[14px] pt-3 border-t border-gray-100 mb-5">
                  <div class="flex justify-between font-bold text-[#2B38E6]">
                    <span>총 할인받은 금액</span>
                    <span id="totalDiscountText">-6,000원</span>
                  </div>
                  <div class="flex justify-between text-gray-600 text-[13.5px]">
                    <span>배달팁 할인</span>
                    <span class="text-[#2B38E6]">-1,000원</span>
                  </div>
                  <div class="flex justify-between text-gray-600 text-[13.5px]">
                    <span>BHC 할인</span>
                    <span class="text-[#2B38E6]">-2,000원</span>
                  </div>
                  <div class="flex justify-between text-gray-600 text-[13.5px]">
                    <span>할인쿠폰</span>
                    <span id="couponReceiptText" class="text-[#2B38E6]">-3,000원</span>
                  </div>
                </div>

                <!-- 최종 결제금액 -->
                <div class="flex justify-between items-center pt-3 border-t border-gray-200 mb-4">
                  <span class="text-[15.5px] font-bold text-gray-900">결제금액</span>
                  <span id="finalReceiptPrice" class="text-[16.5px] font-extrabold text-gray-900">34,500원</span>
                </div>

                <!-- 금액을 확인했어요 버튼 (와이어프레임 6번 라벤더 버튼) -->
                <button
                  id="confirmAmountBtn"
                  type="button"
                  onclick="confirmReceiptAmount()"
                  class="w-full h-[42px] bg-[#E8E7FB] hover:bg-[#DDDDF9] active:scale-[0.99] text-[#2B38E6] text-[14px] font-bold rounded-md flex items-center justify-center gap-1.5 transition"
                >
                  <span id="confirmAmountText">금액을 확인했어요</span>
                </button>
              </div>
            </div>
          </div>
        </section>

      </div>
    </main>

    <!-- 토스트 메시지 영역 -->
    <div id="toastContainer" class="pointer-events-none fixed bottom-24 left-1/2 -translate-x-1/2 z-40 w-max max-w-[90%]">
      <div id="toastPill" class="toast-pill opacity-0 translate-y-2 bg-gray-900/90 text-white text-[13px] font-medium px-4 py-2.5 rounded-full shadow-lg">
        안내 메시지
      </div>
    </div>

    <!-- 하단 고정 결제 바 (와이어프레임 1~6번 우측 정렬 결제하기 버튼) -->
    <footer class="sticky bottom-0 z-30 bg-white px-5 pt-3.5 pb-6 shadow-[0_-2px_12px_rgba(0,0,0,0.05)] flex justify-end items-center shrink-0">
      <div
        id="payBtnWrapper"
        onclick="handleDisabledPayClick()"
        class="inline-block"
      >
        <button
          id="payButton"
          type="button"
          disabled
          onclick="openPaymentModal(event)"
          class="pay-btn h-[50px] px-7 rounded-lg text-[16px] font-extrabold tracking-tight"
        >
          34,500원 결제하기
        </button>
      </div>
    </footer>

    <!-- 결제 완료 모달 -->
    <div id="completeModal" class="hidden fixed inset-0 z-50 bg-black/50 backdrop-blur-[2px] flex items-center justify-center p-5">
      <div class="bg-white w-full max-w-[360px] rounded-2xl p-6 shadow-2xl text-center animate-[sectionReveal_0.3s_ease_forwards]">
        <div class="w-14 h-14 rounded-full bg-[#1CE3CE]/20 text-[#0FA898] flex items-center justify-center mx-auto mb-3.5">
          <svg class="w-8 h-8" fill="none" stroke="currentColor" stroke-width="2.8" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7" />
          </svg>
        </div>
        <h3 class="text-[19px] font-extrabold text-gray-900 mb-1">주문이 완료되었습니다!</h3>
        <p class="text-[13.5px] text-gray-500 mb-4">입력하신 모든 옵션으로 결제가 진행되었어요.</p>

        <div id="orderSummaryBox" class="bg-gray-50 rounded-xl p-3.5 text-left text-[12.5px] text-gray-700 space-y-1.5 mb-5 border border-gray-100">
          <!-- 요약 데이터 JS 삽입 -->
        </div>

        <button
          type="button"
          onclick="resetPrototype()"
          class="w-full h-[44px] bg-[#1CE3CE] hover:bg-[#17D1BD] text-gray-900 font-extrabold text-[14.5px] rounded-xl transition"
        >
          처음부터 다시 체험하기
        </button>
      </div>
    </div>
  </div>

  <script>
    // =========================================================
    // 옵션 데이터 정의
    // =========================================================
    const DELIVERY_OPTIONS = [
      '문 앞에 두고 초인종 눌러주세요',
      '문 앞에 두고 노크해주세요',
      '초인종, 노크 없이 문 앞에만 놔주세요',
      '직접 받을게요.',
      '전화주시면 마중 나갈게요.',
      '직접 입력'
    ];

    const STORE_OPTIONS = [
      '수저, 포크 안 받기',
      '기본 반찬 안 받기',
      '기타 (직접 입력)'
    ];

    const PAYMENT_OPTIONS = [
      '배민페이머니',
      '신용/체크카드',
      '카카오페이'
    ];

    // =========================================================
    // 상태 관리 (State)
    // =========================================================
    const state = {
      activeStep: 0,          // 현재 열려 있는 섹션 인덱스 (0 ~ 5)
      highestUnlocked: 0,     // 지금까지 도달한 최고 단계
      completed: [false, false, false, false, false, false],
      address: {
        base: '서울 서대문구 연세로50',
        detail: '',
        gate: '',
        direction: ''
      },
      deliveryRequest: '',
      storeRequests: [],
      storeRequest: '',
      paymentMethod: '',
      couponDiscount: 3000,
      receiptConfirmed: false
    };

    // =========================================================
    // 체크박스 옵션 UI 렌더링
    // =========================================================
    function createOptionRowHTML(group, labelText) {
      return `
        <button
          type="button"
          data-group="${group}"
          data-value="${labelText}"
          onclick="selectOption('${group}', '${labelText}', this)"
          class="option-row w-full flex items-center gap-3 text-left cursor-pointer"
        >
          <span class="custom-checkbox">
            <svg class="check-icon w-3.5 h-3.5 text-gray-900" fill="none" stroke="currentColor" stroke-width="3" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7" />
            </svg>
          </span>
          <span class="option-label text-[14.5px] text-gray-800">${labelText}</span>
        </button>
      `;
    }

    function renderOptionLists() {
      const deliveryEl = document.getElementById('deliveryOptionsList');
      const storeEl = document.getElementById('storeOptionsList');
      const paymentEl = document.getElementById('paymentOptionsList');

      if (deliveryEl) {
        deliveryEl.classList.remove('has-selection');
        deliveryEl.innerHTML = DELIVERY_OPTIONS.map(opt => createOptionRowHTML('delivery', opt)).join('');
      }
      if (storeEl) {
        storeEl.classList.remove('has-selection');
        storeEl.innerHTML = STORE_OPTIONS.map(opt => createOptionRowHTML('store', opt)).join('');
      }
      if (paymentEl) {
        paymentEl.classList.remove('has-selection');
        paymentEl.innerHTML = PAYMENT_OPTIONS.map(opt => createOptionRowHTML('payment', opt)).join('');
      }
    }

    // =========================================================
    // 2초 자동 전환 타이머 관리 (체크박스 단일 선택 전용)
    // =========================================================
    let pendingAdvanceTimer = null;

    function cancelPendingAdvance() {
      if (pendingAdvanceTimer) {
        clearTimeout(pendingAdvanceTimer);
        pendingAdvanceTimer = null;
      }
    }

    function scheduleAdvance(currentStep, summaryText, delayMs = 2000) {
      cancelPendingAdvance();
      pendingAdvanceTimer = setTimeout(() => {
        pendingAdvanceTimer = null;
        completeAndAdvance(currentStep, summaryText);
      }, delayMs);
    }

    // =========================================================
    // 핵심 인터랙션 1: 섹션 열기/닫기 및 자동 중앙 정렬
    // =========================================================
    function centerSection(stepIndex, smooth = true) {
      const viewport = document.getElementById('scrollViewport');
      const target = document.getElementById(`section-${stepIndex}`);
      if (!viewport || !target || target.classList.contains('hidden')) return;

      const viewportRect = viewport.getBoundingClientRect();
      const targetRect = target.getBoundingClientRect();
      const currentScrollTop = viewport.scrollTop;
      const targetOffsetInViewport = targetRect.top - viewportRect.top;
      const desiredScrollTop =
        currentScrollTop + targetOffsetInViewport - (viewportRect.height / 2) + (targetRect.height / 2);

      viewport.scrollTo({
        top: Math.max(0, desiredScrollTop),
        behavior: smooth ? 'smooth' : 'auto'
      });
    }

    function openSection(stepIndex) {
      cancelPendingAdvance();
      state.activeStep = stepIndex;

      for (let i = 0; i <= 5; i++) {
        const sec = document.getElementById(`section-${i}`);
        if (!sec) continue;

        if (i === stepIndex) {
          const wasHidden = sec.classList.contains('hidden');
          sec.classList.remove('hidden', 'collapsed');
          if (wasHidden) {
            sec.classList.add('section-reveal');
          }
        } else if (i <= state.highestUnlocked) {
          sec.classList.remove('hidden');
          sec.classList.add('collapsed');
        } else {
          sec.classList.add('hidden');
        }
      }

      // 아코디언 애니메이션 진행 중 및 완료 시점에 맞춰 정중앙 스크롤 보정
      requestAnimationFrame(() => centerSection(stepIndex, true));
      setTimeout(() => centerSection(stepIndex, true), 220);
      setTimeout(() => centerSection(stepIndex, true), 400);
    }

    function completeAndAdvance(stepIndex, summaryText) {
      const summaryEl = document.getElementById(`summary-${stepIndex}`);
      if (summaryEl) {
        summaryEl.textContent = summaryText;
      }
      state.completed[stepIndex] = true;

      const nextStep = Math.min(5, stepIndex + 1);
      if (nextStep > state.highestUnlocked) {
        state.highestUnlocked = nextStep;
      }
      openSection(nextStep);
    }

    function handleHeaderClick(stepIndex) {
      if (stepIndex <= state.highestUnlocked && state.activeStep !== stepIndex) {
        openSection(stepIndex);
      }
    }

    // =========================================================
    // 각 단계별 입력 및 선택 핸들러
    // =========================================================

    // 1. 배달 주소 등록 (수기 입력 섹션 -> 확인 시 즉시 이동)
    function submitAddress() {
      const detail = document.getElementById('detailAddressInput').value.trim();
      const gate = document.getElementById('gateCodeInput').value.trim();
      const direction = document.getElementById('directionInput').value.trim();

      state.address.detail = detail;
      state.address.gate = gate;
      state.address.direction = direction;

      const summary = detail ? `연세로50 ${detail}` : '서울 서대문구 연세로50';
      completeAndAdvance(0, summary);
    }

    // 2~4. 체크박스 옵션 선택 (배달 요청사항, 가게 요청사항, 결제수단)
    function selectOption(group, value, btnEl) {
      const listIdMap = {
        delivery: 'deliveryOptionsList',
        store: 'storeOptionsList',
        payment: 'paymentOptionsList'
      };
      const listContainer = document.getElementById(listIdMap[group]);

      // 가게 요청사항: 중복 선택 가능 + 하단 확인 버튼으로 이동
      if (group === 'store') {
        btnEl.classList.toggle('selected');

        const selectedRows = Array.from(
          document.querySelectorAll('.option-row[data-group="store"].selected')
        );
        if (listContainer) {
          if (selectedRows.length > 0) {
            listContainer.classList.add('has-selection');
          } else {
            listContainer.classList.remove('has-selection');
          }
        }

        const customBox = document.getElementById('storeCustomBox');
        const isCustomSelected = selectedRows.some(
          row => row.getAttribute('data-value') === '기타 (직접 입력)'
        );
        if (isCustomSelected) {
          customBox.classList.remove('hidden');
          if (value === '기타 (직접 입력)') {
            setTimeout(() => {
              document.getElementById('storeCustomInput').focus();
              centerSection(2, true);
            }, 80);
          }
        } else {
          customBox.classList.add('hidden');
        }
        return;
      }

      // 배달 요청사항 & 결제수단: 단일 선택 하이라이팅 + 2초 후 자동 이동
      if (listContainer) {
        listContainer.classList.add('has-selection');
      }

      const allRows = document.querySelectorAll(`.option-row[data-group="${group}"]`);
      allRows.forEach(row => row.classList.remove('selected'));
      btnEl.classList.add('selected');

      if (group === 'delivery') {
        const customBox = document.getElementById('deliveryCustomBox');
        if (value === '직접 입력') {
          cancelPendingAdvance();
          customBox.classList.remove('hidden');
          setTimeout(() => {
            document.getElementById('deliveryCustomInput').focus();
            centerSection(1, true);
          }, 80);
          return;
        } else {
          customBox.classList.add('hidden');
          state.deliveryRequest = value;
          scheduleAdvance(1, value, 2000);
        }
      }

      if (group === 'payment') {
        state.paymentMethod = value;
        scheduleAdvance(3, value, 2000);
      }
    }

    function confirmCustomDelivery() {
      const val = document.getElementById('deliveryCustomInput').value.trim() || '직접 입력 요청';
      state.deliveryRequest = val;
      completeAndAdvance(1, val);
    }

    function confirmStoreRequests() {
      const selectedRows = Array.from(
        document.querySelectorAll('.option-row[data-group="store"].selected')
      );
      const customText = document.getElementById('storeCustomInput').value.trim();

      const chosen = selectedRows.map(row => {
        const val = row.getAttribute('data-value');
        if (val === '기타 (직접 입력)') {
          return customText || '기타 요청사항';
        }
        return val;
      });

      state.storeRequests = chosen;
      const summary = chosen.length > 0 ? chosen.join(', ') : '요청사항 없음';
      state.storeRequest = summary;
      completeAndAdvance(2, summary);
    }

    // 5. 할인쿠폰 선택 드롭다운 및 적용
    function toggleCouponDropdown() {
      const dropdown = document.getElementById('couponDropdown');
      const chevron = document.getElementById('couponChevron');
      const isHidden = dropdown.classList.contains('hidden');

      if (isHidden) {
        dropdown.classList.remove('hidden');
        chevron.style.transform = 'rotate(90deg)';
      } else {
        dropdown.classList.add('hidden');
        chevron.style.transform = 'rotate(0deg)';
      }
      setTimeout(() => centerSection(4, true), 60);
    }

    function selectCoupon(amount, label) {
      state.couponDiscount = amount;

      const labelEl = document.getElementById('selectedCouponLabel');
      const badgeEl = document.getElementById('couponBadgeText');
      if (amount > 0) {
        labelEl.innerHTML = `<strong class="text-[#2B38E6] font-bold">${amount.toLocaleString()}원</strong> 할인 적용됨`;
        badgeEl.textContent = amount === 3000 ? '최대 할인 적용중' : label;
      } else {
        labelEl.innerHTML = `<span class="text-gray-500">쿠폰 적용 안 함</span>`;
        badgeEl.textContent = '쿠폰 미적용';
      }

      document.getElementById('couponDropdown').classList.add('hidden');
      document.getElementById('couponChevron').style.transform = 'rotate(0deg)';

      // 쿠폰 변경 시 영수증 금액 업데이트 및 기존 금액 확인 초기화
      if (state.receiptConfirmed) {
        state.receiptConfirmed = false;
        const payBtn = document.getElementById('payButton');
        payBtn.disabled = true;
        const confirmBtn = document.getElementById('confirmAmountBtn');
        confirmBtn.classList.remove('bg-[#2B38E6]', 'text-white');
        confirmBtn.classList.add('bg-[#E8E7FB]', 'text-[#2B38E6]');
        document.getElementById('confirmAmountText').textContent = '금액을 확인했어요';
      }

      updatePriceUI();
    }

    function confirmCouponStep() {
      const summary = state.couponDiscount > 0
        ? `${state.couponDiscount.toLocaleString()}원 할인`
        : '쿠폰 미적용';
      updatePriceUI();
      completeAndAdvance(4, summary);
    }

    function updatePriceUI() {
      const baseMenu = 38500;
      const deliveryTip = 2000;
      const fixedDiscounts = 3000; // 배달팁 할인 1,000 + BHC 할인 2,000
      const totalDiscount = fixedDiscounts + state.couponDiscount;
      const finalPrice = baseMenu + deliveryTip - totalDiscount;

      document.getElementById('totalDiscountText').textContent = `-${totalDiscount.toLocaleString()}원`;
      document.getElementById('couponReceiptText').textContent =
        state.couponDiscount > 0 ? `-${state.couponDiscount.toLocaleString()}원` : '0원';
      document.getElementById('finalReceiptPrice').textContent = `${finalPrice.toLocaleString()}원`;
      document.getElementById('payButton').textContent = `${finalPrice.toLocaleString()}원 결제하기`;
    }

    // 6. 영수증 금액 확인 -> 하단 결제하기 버튼 활성화
    function confirmReceiptAmount() {
      state.receiptConfirmed = true;
      state.completed[5] = true;

      const finalPriceText = document.getElementById('finalReceiptPrice').textContent;
      document.getElementById('summary-5').textContent = `결제금액 ${finalPriceText}`;

      const confirmBtn = document.getElementById('confirmAmountBtn');
      confirmBtn.classList.remove('bg-[#E8E7FB]', 'hover:bg-[#DDDDF9]', 'text-[#2B38E6]');
      confirmBtn.classList.add('bg-[#2B38E6]', 'text-white');
      document.getElementById('confirmAmountText').textContent = '금액 확인 완료 ✓';

      const payBtn = document.getElementById('payButton');
      payBtn.disabled = false;

      showToast('결제하기 버튼이 활성화되었습니다!');
    }

    function handleDisabledPayClick() {
      const payBtn = document.getElementById('payButton');
      if (!payBtn.disabled) return;

      if (state.highestUnlocked < 5) {
        showToast('모든 주문 옵션을 먼저 입력해 주세요.');
      } else {
        openSection(5);
        showToast("영수증에서 '금액을 확인했어요' 버튼을 눌러주세요.");
      }
    }

    function openPaymentModal(e) {
      if (e) e.stopPropagation();
      const payBtn = document.getElementById('payButton');
      if (payBtn.disabled) return;

      const addrFull = state.address.detail
        ? `${state.address.base} ${state.address.detail}`
        : state.address.base;
      const finalPriceText = document.getElementById('finalReceiptPrice').textContent;

      const summaryBox = document.getElementById('orderSummaryBox');
      summaryBox.innerHTML = `
        <div class="flex justify-between gap-2"><span class="text-gray-400 shrink-0">배달 주소</span><span class="font-semibold text-gray-800 text-right">${addrFull}</span></div>
        <div class="flex justify-between gap-2"><span class="text-gray-400 shrink-0">배달 요청</span><span class="font-semibold text-gray-800 text-right">${state.deliveryRequest || '-'}</span></div>
        <div class="flex justify-between gap-2"><span class="text-gray-400 shrink-0">가게 요청</span><span class="font-semibold text-gray-800 text-right">${state.storeRequest || '요청사항 없음'}</span></div>
        <div class="flex justify-between gap-2"><span class="text-gray-400 shrink-0">결제 수단</span><span class="font-semibold text-gray-800 text-right">${state.paymentMethod || '-'}</span></div>
        <div class="flex justify-between gap-2 pt-1.5 border-t border-gray-200"><span class="text-gray-500 font-bold shrink-0">최종 결제</span><span class="font-extrabold text-[#2B38E6] text-right">${finalPriceText}</span></div>
      `;

      document.getElementById('completeModal').classList.remove('hidden');
    }

    // =========================================================
    // 토스트 알림 & 전체 초기화
    // =========================================================
    let toastTimeout = null;
    function showToast(message) {
      const pill = document.getElementById('toastPill');
      if (!pill) return;

      pill.textContent = message;
      pill.classList.remove('opacity-0', 'translate-y-2');
      pill.classList.add('opacity-100', 'translate-y-0');

      if (toastTimeout) clearTimeout(toastTimeout);
      toastTimeout = setTimeout(() => {
        pill.classList.remove('opacity-100', 'translate-y-0');
        pill.classList.add('opacity-0', 'translate-y-2');
      }, 2200);
    }

    function resetPrototype() {
      cancelPendingAdvance();

      state.activeStep = 0;
      state.highestUnlocked = 0;
      state.completed = [false, false, false, false, false, false];
      state.address = {
        base: '서울 서대문구 연세로50',
        detail: '',
        gate: '',
        direction: ''
      };
      state.deliveryRequest = '';
      state.storeRequests = [];
      state.storeRequest = '';
      state.paymentMethod = '';
      state.couponDiscount = 3000;
      state.receiptConfirmed = false;

      // 입력값 및 요약 텍스트 초기화
      ['detailAddressInput', 'gateCodeInput', 'directionInput', 'deliveryCustomInput', 'storeCustomInput'].forEach(id => {
        const el = document.getElementById(id);
        if (el) el.value = '';
      });
      for (let i = 0; i <= 5; i++) {
        const sumEl = document.getElementById(`summary-${i}`);
        if (sumEl) sumEl.textContent = '';
      }

      document.getElementById('deliveryCustomBox').classList.add('hidden');
      document.getElementById('storeCustomBox').classList.add('hidden');
      document.getElementById('couponDropdown').classList.add('hidden');
      document.getElementById('couponChevron').style.transform = 'rotate(0deg)';
      document.getElementById('selectedCouponLabel').innerHTML = `<strong class="text-[#2B38E6] font-bold">3,000원</strong> 할인 적용됨`;
      document.getElementById('couponBadgeText').textContent = '최대 할인 적용중';

      const confirmBtn = document.getElementById('confirmAmountBtn');
      confirmBtn.classList.remove('bg-[#2B38E6]', 'text-white');
      confirmBtn.classList.add('bg-[#E8E7FB]', 'hover:bg-[#DDDDF9]', 'text-[#2B38E6]');
      document.getElementById('confirmAmountText').textContent = '금액을 확인했어요';

      document.getElementById('payButton').disabled = true;
      document.getElementById('completeModal').classList.add('hidden');

      renderOptionLists();
      updatePriceUI();
      openSection(0);
    }

    // 초기 실행
    window.addEventListener('DOMContentLoaded', () => {
      renderOptionLists();
      updatePriceUI();

      const resetBtn = document.getElementById('resetBtn');
      if (resetBtn) {
        resetBtn.addEventListener('click', () => {
          resetPrototype();
          showToast('주문 옵션이 초기화되었습니다.');
        });
      }

      setTimeout(() => centerSection(0, false), 50);
    });
  </script>
</body>
</html>
